apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matter-server
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: glumserver.localdomain
      http:
        paths:
          - path: /ws
            pathType: Exact
            backend:
              service:
                name: matter-server
                port:
                  name: websocket
