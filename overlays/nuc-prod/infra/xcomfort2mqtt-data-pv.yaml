apiVersion: v1
kind: PersistentVolume
metadata:
  name: xcomfort2mqtt-data-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  claimRef:
    namespace: home-ops
    name: xcomfort2mqtt-data
  hostPath:
    path: /home/epaulsen/containers/hass/volumes/xcomfort2mqtt-data
    type: Directory
