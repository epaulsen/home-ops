apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: home-ops
spec:
  description: Home automation stack for single-node k3s NUC
  sourceRepos:
    - https://github.com/epaulsen/home-ops.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: home-ops
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
