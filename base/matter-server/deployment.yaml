apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server@sha256:ee149c7c67eff0e90f131e8f0d628f7b099591ec58473c8cda1209e8ae4df66e
          ports:
            - containerPort: 5580
              name: websocket
              protocol: TCP
          env:
            - name: FABRIC_ID
              value: "2"
            - name: VENDOR_ID
              value: "4939"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: matter-server-data
              mountPath: /data
      volumes:
        - name: matter-server-data
          persistentVolumeClaim:
            claimName: matter-server-data-v2
