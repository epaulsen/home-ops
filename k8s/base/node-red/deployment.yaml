apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      initContainers:
        - name: set-data-permissions
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - chown -R 1000:1000 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: node-red-data
              mountPath: /data
      containers:
        - name: node-red
          image: nodered/node-red:4.1.3
          env:
            - name: TZ
              value: Europe/Oslo
            - name: NODE_RED_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: node-red-admin-auth
                  key: password-hash
          ports:
            - containerPort: 1880
              name: http
          volumeMounts:
            - name: node-red-data
              mountPath: /data
            - name: node-red-settings
              mountPath: /data/settings.js
              subPath: settings.js
              readOnly: true
      volumes:
        - name: node-red-data
          persistentVolumeClaim:
            claimName: node-red-data
        - name: node-red-settings
          configMap:
            name: node-red-settings
