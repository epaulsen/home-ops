apiVersion: apps/v1
kind: Deployment
metadata:
  name: netdaemon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netdaemon
  template:
    metadata:
      labels:
        app: netdaemon
    spec:
      containers:
        - name: netdaemon
          image: epaulsen/homeautomation:latest
          env:
            - name: TZ
              value: Europe/Oslo
            - name: HomeAssistant__Host
              value: homeassistant
            - name: HomeAssistant__Port
              value: "8123"
            - name: HomeAssistant__Ssl
              value: "false"
            - name: HomeAssistant__Token
              valueFrom:
                secretKeyRef:
                  name: netdaemon-credentials
                  key: HASS_TOKEN
            - name: Mqtt__Host
              value: mqtt
            - name: Mqtt__Username
              value: mqtt
            - name: Mqtt__Password
              valueFrom:
                secretKeyRef:
                  name: netdaemon-credentials
                  key: MQTT_PASSWORD
            - name: Mqtt__Port
              value: "1883"
            - name: Unifi__BaseUrl
              value: https://unifi.localdomain/proxy/network/integration/
            - name: Unifi__ApiKey
              valueFrom:
                secretKeyRef:
                  name: netdaemon-credentials
                  key: UnifiApiKey
          volumeMounts:
            - name: netdaemon-config
              mountPath: /config
      volumes:
        - name: netdaemon-config
          persistentVolumeClaim:
            claimName: netdaemon-config-v2
