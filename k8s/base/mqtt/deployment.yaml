apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mqtt
  template:
    metadata:
      labels:
        app: mqtt
    spec:
      initContainers:
        - name: mqtt-passwd
          image: eclipse-mosquitto:2.0.22
          command:
            - sh
            - -c
            - mosquitto_passwd -c -b /passwd/passwd "$MQTT_USERNAME" "$MQTT_PASSWORD" && chmod 644 /passwd/passwd
          env:
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mqtt-credentials
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-credentials
                  key: password
          volumeMounts:
            - name: passwd
              mountPath: /passwd
      containers:
        - name: mqtt
          image: eclipse-mosquitto:2.0.22
          command:
            - mosquitto
            - -c
            - /mosquitto/config/mosquitto.conf
          ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 9001
              name: websocket
          volumeMounts:
            - name: mqtt-data
              mountPath: /mosquitto
            - name: mqtt-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: passwd
              mountPath: /passwd
      volumes:
        - name: mqtt-data
          persistentVolumeClaim:
            claimName: mqtt-data
        - name: mqtt-config
          configMap:
            name: mqtt-config
        - name: passwd
          emptyDir: {}
