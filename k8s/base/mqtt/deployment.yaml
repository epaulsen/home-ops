apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mqtt
  template:
    metadata:
      labels:
        app: mqtt
    spec:
      containers:
        - name: mqtt
          image: eclipse-mosquitto:2.0
          command:
            - mosquitto
            - -c
            - /mosquitto/config/mosquitto-no-auth.conf
          ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 9001
              name: websocket
          volumeMounts:
            - name: mqtt-data
              mountPath: /mosquitto
            - name: mqtt-config
              mountPath: /mosquitto/config/mosquitto-no-auth.conf
              subPath: mosquitto-no-auth.conf
      volumes:
        - name: mqtt-data
          persistentVolumeClaim:
            claimName: mqtt-data
        - name: mqtt-config
          configMap:
            name: mqtt-config
