apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-ops-root
spec:
  project: home-ops
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/epaulsen/home-ops.git
    targetRevision: main
    path: k8s/apps/nuc-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
