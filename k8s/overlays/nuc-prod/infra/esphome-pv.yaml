apiVersion: v1
kind: PersistentVolume
metadata:
  name: esphome-config-pv
spec:
  capacity:
    storage: 4Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    path: /home/epaulsen/containers/hass/esphome
    type: DirectoryOrCreate
