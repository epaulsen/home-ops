apiVersion: v1
kind: PersistentVolume
metadata:
  name: netdaemon-config-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    path: /home/epaulsen/containers/hass/netdaemon-config
    type: DirectoryOrCreate
